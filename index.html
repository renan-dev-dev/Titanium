<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./src/assets/images/apple.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apple iPhone</title>
    <script>
      // Força scroll em dispositivos móveis
      document.addEventListener('DOMContentLoaded', function() {
        if (window.innerWidth <= 768) {
          document.documentElement.style.overflowY = 'scroll';
          document.body.style.overflowY = 'scroll';
          document.body.style.height = 'auto';
          document.body.style.minHeight = '100vh';
          document.body.style.touchAction = 'auto';
          document.body.style.webkitOverflowScrolling = 'touch';
          
          // Força barra de scroll visível
          document.documentElement.style.scrollbarWidth = 'thin';
          document.body.style.scrollbarWidth = 'thin';
          
          const root = document.getElementById('root');
          if (root) {
            root.style.overflowY = 'visible';
            root.style.height = 'auto';
            root.style.minHeight = '100vh';
          }
          
          // Adiciona conteúdo extra temporário para garantir scroll
          const tempDiv = document.createElement('div');
          tempDiv.style.height = '50px';
          tempDiv.style.backgroundColor = 'transparent';
          tempDiv.style.width = '100%';
          document.body.appendChild(tempDiv);
          
          // Remove após 2 segundos
          setTimeout(() => {
            if (tempDiv.parentNode) {
              tempDiv.parentNode.removeChild(tempDiv);
            }
          }, 2000);
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
